test:
  runs-on: ubuntu-latest

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Start server
      run: npm start > server.log 2>&1 &

    - name: Wait for server
      run: |
        for i in {1..10}; do
          if curl -s http://localhost:3000/health; then
            exit 0
          fi
          sleep 1
        done
        cat server.log
        exit 1

    - name: Run tests
      run: npm test

    - name: Run lint
      run: npm run lint